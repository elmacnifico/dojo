name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go test
        run: go test -race ./...

  # End-to-end run of the shipped blackbox example suite (AGENTS.md §8).
  # The eval suite is excluded: it requires a live GEMINI_API_KEY.
  example-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          # The example suite's dojo.yaml targets 127.0.0.1:5432.
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run blackbox example suite
        run: go run cmd/dojo/main.go ./example/tests/blackbox
      - name: Integration test (built binary)
        run: go test -tags=integration -race ./cmd/dojo/...
